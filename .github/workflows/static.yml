name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate, Install and Build
        run: |
          # Encontra o diretório onde está o package.json
          PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" -print -quit | xargs dirname)
          cd "$PACKAGE_PATH"
          
          # Instala as dependências exatas do projeto
          npm install
          
          # Executa o build usando as dependências locais
          npm run build
          
          # Prepara a pasta dist na raiz para o upload do GitHub Pages
          mkdir -p ../dist_final
          cp -r dist/* ../dist_final/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_final'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4