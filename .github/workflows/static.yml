name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate Project, Install & Build
        run: |
          # 1. Encontra a pasta onde reside o index.html (ignorando node_modules)
          INDEX_FILE=$(find . -name "index.html" -not -path "*/node_modules/*" -print -quit)
          PROJECT_DIR=$(dirname "$INDEX_FILE")
          
          echo "Projeto encontrado no diretório: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Instala as dependências e roda o build via Vite local
          npm install
          npx vite build

          # 3. Copia o resultado do dist para a raiz para o GitHub Pages ler
          mkdir -p $GITHUB_WORKSPACE/dist_final
          cp -r dist/* $GITHUB_WORKSPACE/dist_final/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_final'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4